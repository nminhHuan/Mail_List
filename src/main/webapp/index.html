<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Murach's Java Servlets and JSP</title>
    <link rel="stylesheet" href="main.css" type="text/css"/>
</head>
<body>
    <img src="https://www.southeastlinuxfest.org/wp-content/uploads/2014/06/Murach_image.jpg" alt="Murach logo" width="150">
    <h1>Survey</h1>
    <br>
    <p>If you have a moment, we'd appreciate it if you would fill out this survey.</p>
    <h2>Your information:</h2>
    <form action="emailList" method="post">
        <input type="hidden" name="action" value="add">

        <label for="firstName">First Name</label>
        <input type="text" id="firstName" name="firstName" required><br>

        <label for="lastName">Last Name</label>
        <input type="text" id="lastName" name="lastName" required><br>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required><br>

        <label for="dateOfBirth">Date of Birth</label>
        <input type="date" id="dateOfBirth" name="dateOfBirth" required><br>

        <h2>How did you hear about us?</h2>
        <label class="radio"><input type="radio" name="heardFrom" value="search" checked> Search engine</label>
        <label class="radio"><input type="radio" name="heardFrom" value="word"> Word of mouth</label>
        <label class="radio"><input type="radio" name="heardFrom" value="social"> Social Media</label>
        <label class="radio"><input type="radio" name="heardFrom" value="other"> Other</label>

        <h2>
            Would you like to receive announcements<br>
            about new CDs and special offers?
        </h2>

        <label class="checkbox">
            <input type="checkbox" name="receive" value="yes">
            YES, I'd like that.
        </label>
        <br>

        <label class="checkbox">
            <input type="checkbox" name="receive" value="yes">
            YES, please send me email announcements.
        </label>
        <br><br>

        <label for="contactBy">Please contact me by:</label>
        <select id="contactBy" name="contactBy">
            <option value="email_or_postal">Email or postal mail</option>
            <option value="email">Email</option>
            <option value="postal">Postal mail</option>
        </select>

        <br><br>

        <input type="submit" value="Submit" id="submit">
    </form>
</body>
</html>
